<div id="artist-network-graph">
  <h2 style="text-align: center;">Artist Collaboration Network</h2>

  <div id="controls-container">
    <!-- Year selection buttons -->
    <div id="year-container">
      <label>Select Year:</label>
      <button class="year-button" data-year="all">All Years</button>
      <button class="year-button" data-year="2017">2017</button>
      <button class="year-button" data-year="2018">2018</button>
      <button class="year-button" data-year="2019">2019</button>
      <button class="year-button" data-year="2020">2020</button>
      <button class="year-button" data-year="2021">2021</button>
      <button class="year-button" data-year="2022">2022</button>
      <button class="year-button" data-year="2023">2023</button>
      <button class="year-button" data-year="2024">2024</button>
    </div>

    <!-- Search input for artist names -->
    <div id="search-container">
      <label for="search-input">Search Artist:</label>
      <input type="text" id="search-input" placeholder="Enter artist name">
    </div>

    <!-- Slider for filtering links based on collaboration weight -->
    <div id="filter-container">
      <label for="weight-slider">Minimum Collaboration Weight:</label>
      <input type="range" id="weight-slider" min="1" max="20" value="1" step="1">
      <span id="weight-value">1</span>
    </div>

    <!-- Top K Artist Filter -->
    <div id="topk-filter-container">
      <label for="topk-input">Top K Artists (by total streams):</label>
      <input type="number" id="topk-input" value="50" min="1">
    </div>
  </div>

  <!-- Artist Network Chart Container-->
  <div id="chart-container" style="display: flex;">
    <div id="artist-network-container"></div>
    <div id="info-panel" style="flex: 1; padding: 20px; border-left: 1px solid #ccc;">
    </div>
  </div>

</div>
